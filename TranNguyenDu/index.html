<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trần Nguyễn Du – Minecraft Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="locked">

<!-- Nền: video ở cổng captcha; vào trong profile thì đổi sang ảnh nền khác -->
<canvas id="bg" aria-hidden="true"></canvas>
<video id="bgVideo" autoplay muted loop playsinline preload="auto">
  <source src="background.mp4" type="video/mp4">
  <source src="bg.mp4" type="video/mp4">
  <source src="354007_medium.mp4" type="video/mp4">
  <source src="video.mp4" type="video/mp4">
</video>
<div id="bgProfile" aria-hidden="true"></div>
<!-- Video nền profile (chạy sau khi vượt captcha) -->
<video id="bgProfileVideo" muted loop playsinline preload="auto">
  <source src="viesnap.vn_tiktok_7510943527916899602.mp4" type="video/mp4">
  <source src="profile-video.mp4" type="video/mp4">
  <source src="background.mp4" type="video/mp4">
</video>
<!-- Nhạc nền profile -->
<audio id="bgMusic" loop preload="auto">
  <source src="viesnap.vn_tiktok_7510943527916899602.mp3" type="audio/mpeg">
  <source src="bg-music.mp3" type="audio/mpeg">
</audio>
<!-- Tiếng click (nếu thiếu file, JS tự tạo tiếng beep) -->
<audio id="clickSnd" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
<div id="bubble" role="status"></div>

<!-- ===== CỔNG CAPTCHA ===== -->
<div id="gate">
  <div class="gate-panel" id="gatePanel">
    <div class="gate-head" id="gateHead">
      <h1 class="px">VERIFY</h1>
      <button class="btn" id="gateMin" type="button" aria-label="Thu nhỏ / Minimize">—</button>
    </div>
    <div class="gate-body">
      <p data-i="gate_desc"></p>
      <button id="bar" type="button"><span class="chk"></span><span id="barText" data-i="gate_bar"></span></button>
      <form id="quiz">
        <div><span data-i="gate_q"></span> <span id="round"></span></div>
        <div id="q" class="px"></div>
        <input id="ans" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer">
        <button class="btn" type="submit" data-i="gate_ok"></button>
        <p id="msg" role="status"></p>
      </form>
    </div>
  </div>
</div>

<!-- Nút ngôn ngữ (luôn hiện) -->
<button class="btn" id="langBtn" type="button" aria-label="Language">EN</button>

<!-- Thanh điều khiển: tốc độ + ngày/đêm (CHỈ hiện ở cổng captcha) -->
<div class="speed">
  <span data-i="speed"></span>
  <button class="btn on" type="button" data-speed="1" title="x1">x1</button>
  <button class="btn" type="button" data-speed="2" title="x2">x2</button>
  <button class="btn" type="button" data-speed="5" title="x5">x5</button>
  <span class="sep"></span>
  <button class="btn" type="button" data-time="day" title="Ban ngày" aria-label="Day">☀</button>
  <button class="btn" type="button" data-time="night" title="Ban đêm" aria-label="Night">🌙</button>
</div>

<!-- ===== MENU ===== -->
<header class="nav">
  <b class="px">TD<span class="dot">.</span></b>
  <nav id="nav"></nav>
</header>

<main class="wrap" id="wrap">

<!-- ===== PROFILE ===== -->
<section id="profile" class="reveal">
  <div class="hero">
    <div class="hero-txt">
      <p class="hello" data-i="hello"></p>
      <h1 class="name px" id="heroName"></h1>
      <div class="role"><span id="typed"></span><span class="cursor"></span></div>
      <p class="lead" data-i="lead"></p>
      <div class="row">
        <a class="btn big" href="#projects" data-i="cta_projects"></a>
        <a class="btn big ghost" href="#contact" data-i="cta_contact"></a>
      </div>
      <div class="chips">
        <span class="chip px">⛏ Miner</span>
        <span class="chip px">🎮 Gamer</span>
        <span class="chip px">💻 Coder</span>
      </div>
    </div>

    <div class="hero-card">
      <div class="hero-head px" data-i="card_title"></div>
      <div class="avatar-wrap" id="avatarWrap">
        <img id="heroAvatar" src="avatar.png" alt="Ảnh đại diện Trần Nguyễn Du" width="148" height="148">
        <canvas id="heroSteve" class="ava-fallback" aria-label="Steve – bấm để vẫy tay"></canvas>
      </div>
      <p class="hero-tip" data-i="hero_tip"></p>
      <div class="info" id="info"></div>
      <div class="stats">
        <div><b class="px" data-count="2">0</b><span data-i="st_projects"></span></div>
        <div><b class="px" data-count="8">0</b><span data-i="st_tech"></span></div>
        <div><b class="px" data-count="3">0</b><span data-i="st_years"></span></div>
      </div>
    </div>
  </div>
  <div class="panel about"><p data-i="about1"></p><p data-i="about2"></p></div>
</section>

<!-- ===== MINE ===== -->
<section id="mine" class="reveal">
  <h2 class="px"><span class="num px">01</span><span data-i="nav_mine"></span></h2>
  <p class="hint" data-i="mine_hint"></p>
  <div class="panel mine">
    <div class="ore-wrap">
      <canvas id="ore" width="16" height="16" role="button" tabindex="0" aria-label="Mine"></canvas>
      <p class="ore-lab px" data-i="ore_lab"></p>
    </div>
    <div class="recipes" id="recipes"></div>
  </div>
</section>

<!-- ===== SKILLS ===== -->
<section id="skills" class="reveal">
  <h2 class="px"><span class="num px">02</span><span data-i="nav_skills"></span></h2>
  <div class="grid2">
    <div class="panel"><h3 data-i="sk_langs"></h3><div id="skillBars"></div></div>
    <div class="panel">
      <h3 data-i="sk_tech"></h3><div class="tags" id="techTags"></div>
      <h3 data-i="sk_soft"></h3><div class="tags" id="softTags"></div>
    </div>
  </div>
</section>

<!-- ===== PROJECTS ===== -->
<section id="projects" class="reveal">
  <h2 class="px"><span class="num px">03</span><span data-i="nav_projects"></span></h2>
  <p class="hint" data-i="proj_hint"></p>
  <div class="projects" id="projList"></div>
</section>

<!-- ===== EDUCATION ===== -->
<section id="education" class="reveal">
  <h2 class="px"><span class="num px">04</span><span data-i="nav_education"></span></h2>
  <div class="panel"><ul class="tl" id="timeline"></ul></div>
</section>

<!-- ===== SECRETS ===== -->
<section id="secrets" class="reveal">
  <h2 class="px"><span class="num px">05</span><span data-i="nav_secrets"></span></h2>
  <div class="facts" id="facts"></div>
</section>

<!-- ===== CONTACT ===== -->
<section id="contact" class="reveal">
  <h2 class="px"><span class="num px">06</span><span data-i="nav_contact"></span></h2>
  <div class="panel">
    <div class="row contact-links" id="contactLinks"></div>
    <form class="msg" id="msgForm">
      <h3 data-i="f_title"></h3>
      <label><span data-i="f_name"></span><input name="name" required></label>
      <label><span data-i="f_email"></span><input type="email" name="email" required></label>
      <label><span data-i="f_msg"></span><textarea name="message" rows="4" required></textarea></label>
      <button class="btn big" type="submit" data-i="f_send"></button>
      <p class="status" id="formStatus" role="status"></p>
    </form>
  </div>
</section>

<footer data-i="footer"></footer>
</main>

<!-- ===== HUD ===== -->
<div class="hud xp" aria-hidden="true"><b class="px" id="lvl">0</b><div class="track"><i id="xpFill"></i></div></div>
<div class="hud invbar" id="invBar"></div>

<!-- Chat lệnh: nhấn / hoặc T -->
<form id="chat" hidden><input id="chatIn" maxlength="60" placeholder="/help" autocomplete="off"></form>

<!-- Xác minh khi ở trang quá lâu -->
<div id="hold" hidden>
  <div class="panel hold-panel">
    <h3 class="px" data-i="idle_title"></h3>
    <p data-i="idle_text"></p>
    <button class="btn big" id="holdBtn" type="button" data-i="idle_btn"></button>
    <div class="holdbar"><i id="holdFill"></i></div>
    <p id="holdMsg"></p>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
